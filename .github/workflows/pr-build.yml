name: PR Build

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "fastlane/**"
      - "metadata/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute PR version
        id: version
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          PR_NUMBER="${{ github.event.pull_request.number || 'manual' }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "name=${BASE_VERSION}-pr.${PR_NUMBER}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short-sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up CI keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ] && [ -n "$CI_KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="$CI_KEYSTORE_PASSWORD"
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > yoplayer-ci.jks
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkey -v -keystore yoplayer-ci.jks -alias yoplayer-ci-key -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=YoPlayer CI, OU=Dev, O=YoPlayer, L=World, S=World, C=US"
          fi
          {
            echo "storeFile=yoplayer-ci.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=yoplayer-ci-key"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build PR release APKs
        run: >
          ./gradlew :app:assembleRelease
          -Pyoplayer.enableAbiSplits=true
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Verify and rename split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p pr-apks
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            if [ -f "$apk" ]; then
              "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk" || true
              cp "$apk" "pr-apks/YoPlayer-${{ steps.version.outputs.name }}-$abi.apk"
            fi
          done

      - name: Upload PR APK artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: YoPlayer-pr-${{ steps.version.outputs.short-sha }}
          path: pr-apks/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
