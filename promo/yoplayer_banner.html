<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YoPlayer — Showcase Banner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #08080A;
      color: #ECECEF;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      gap: 20px;
    }
    .bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .sub {
      font-size: 12px;
      color: #8E8E98;
      margin-top: 2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #ECECEF;
      color: #0D0D10;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: #FFFFFF; transform: translateY(-1px); }
    .frame {
      width: 100%;
      max-width: 1200px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.72);
      background: #0D0D10;
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <div class="title">YoPlayer — Material 3 Expressive Banner</div>
      <div class="sub">2650 × 1910 PNG • Реальные скриншоты интерфейса</div>
    </div>
    <a class="btn" href="yoplayer_banner.png" download="yoplayer_banner.png">
      Скачать PNG (2650×1910)
    </a>
  </div>
  <div class="frame">
    <img src="yoplayer_banner.png" alt="YoPlayer Showcase Banner" />
  </div>
</body>
</html>
